<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quem é essa criança?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=4">
<script src="config.js?v=4"></script>
<script src="lightbox.js?v=4" defer></script>
</head>
<body>
<main class="wrap" id="app"></main>

<script>
const F = QUIZ.fotos, N = QUIZ.nomes, TOTAL = F.length;
const LS = "quiz-criancas-v1";
let st = { nome: "", i: 0, resp: {}, etapa: "inicio", enviado: false };
try { const s = JSON.parse(localStorage.getItem(LS)); if (s) st = Object.assign(st, s); } catch (e) {}
const salvar = () => { try { localStorage.setItem(LS, JSON.stringify(st)); } catch (e) {} };
const app = document.getElementById("app");
// identificador deste celular: guardado no navegador e num cookie
function dispositivo() {
  let id = null;
  try { id = localStorage.getItem("quiz-criancas-disp"); } catch (e) {}
  if (!id) { const m = document.cookie.match(/(?:^|; )qcdisp=([a-f0-9-]+)/); if (m) id = m[1]; }
  if (!id) id = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(16) + Math.random().toString(16).slice(2));
  try { localStorage.setItem("quiz-criancas-disp", id); } catch (e) {}
  document.cookie = "qcdisp=" + id + "; max-age=31536000; path=/; SameSite=Lax";
  return id;
}
const DISP = dispositivo();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const foto = c => "fotos/" + c + ".jpg";
const giro = i => ((i * 37) % 5 - 2) * 0.8 + "deg";
const respondidas = () => F.filter(c => st.resp[c]).length;

// pré-carrega as fotos
F.forEach(c => { const im = new Image(); im.src = foto(c); });

function render() {
  if (st.enviado) return telaFim();
  if (st.etapa !== "foto" || !st.nome) return telaInicio();
  telaFoto();
  window.scrollTo(0, 0);
}

function telaInicio() {
  app.innerHTML = `
    <div class="entrada">
      <span class="etiqueta">Dinâmica</span>
      <h1>Quem é essa <em>criança?</em></h1>
      <form id="f" class="campo-nome">
        <label for="nome">Seu nome</label>
        <input type="text" id="nome" maxlength="60" autocomplete="name" placeholder="Nome e sobrenome" value="${esc(st.nome)}" required autofocus>
        <p class="dica">Use o sobrenome: temos dois Brunos e duas Thais na turma.</p>
      </form>
    </div>
    <p class="erro" id="msgIni" hidden></p>
    <div class="nav"><button class="btn" form="f" type="submit">Começar</button></div>`;
  document.getElementById("f").addEventListener("submit", async e => {
    e.preventDefault();
    const v = document.getElementById("nome").value.trim().replace(/\s+/g, " ");
    const b = app.querySelector("button[form=f]"), msg = document.getElementById("msgIni");
    if (v.split(" ").length < 2) { msg.hidden = false; msg.textContent = "Digite seu nome e sobrenome."; return; }
    b.disabled = true; b.textContent = "Conferindo...";
    let r = "OK";
    try { r = await rpc("quiz_pode_participar", { p_nome: v, p_dispositivo: DISP }); } catch (err) {}
    b.disabled = false; b.textContent = "Começar";
    if (r === "JA_ENVIOU_CELULAR") { msg.hidden = false; msg.textContent = "Este celular já enviou respostas. Só vale uma participação por celular."; return; }
    if (r === "JA_ENVIOU_NOME") { msg.hidden = false; msg.textContent = `Já existe uma resposta com o nome "${v}". Se for outra pessoa com o mesmo nome, use também o sobrenome.`; return; }
    st.nome = v; st.etapa = "foto"; salvar(); render();
  });
}

function telaFoto() {
  const c = F[st.i], atual = st.resp[c] || "";
  const usados = {};
  Object.entries(st.resp).forEach(([k, v]) => { if (v && k !== c) usados[v] = true; });
  app.innerHTML = `
    ${st.i === 0 ? `<div class="intro"><h2>Quem é essa <em>criança?</em></h2><p class="sub">São ${TOTAL} fotos de infância da turma. Para cada foto, escolha de quem você acha que é. Quem acertar mais leva a cesta de doces. O resultado só sai no final.</p></div>` : ""}
    <div class="topo"><span class="etiqueta">Criança ${st.i + 1} de ${TOTAL}</span><span class="dica">${respondidas()} respondidas</span></div>
    <div class="progresso"><div style="width:${(respondidas() / TOTAL) * 100}%"></div></div>
    <div class="polaroid" style="--giro:${giro(st.i)}">
      <div class="moldura"><img src="${foto(c)}" alt="Foto de infância número ${st.i + 1}"></div>
      <div class="legenda ${atual ? "" : "vazia"}">${atual ? esc(atual) : "quem é?"}</div>
    </div>
    <p class="dica">Toque no nome para escolher. A escolha é definitiva: não dá para voltar nem trocar. Nomes já escolhidos ficam bloqueados.</p>
    <div class="nomes">${N.map(n => `<button type="button" class="nome ${usados[n] ? "usado" : ""}" data-n="${esc(n)}" ${usados[n] ? "disabled" : ""}>${esc(n)}</button>`).join("")}</div>
    <p class="erro" id="msg" hidden></p>
    <div class="nav" id="navEnvio" hidden>
      <button class="btn" id="reenviar">Tentar enviar de novo</button>
    </div>`;
  let travado = false;
  app.querySelectorAll(".nome:not([disabled])").forEach(b => b.addEventListener("click", () => {
    if (travado) return;
    travado = true;
    st.resp[c] = b.dataset.n;
    b.classList.add("escolhido");
    app.querySelectorAll(".nome").forEach(x => x.disabled = true);
    app.querySelector(".legenda").textContent = b.dataset.n;
    app.querySelector(".legenda").classList.remove("vazia");
    if (st.i < TOTAL - 1) { st.i++; salvar(); setTimeout(render, 350); }
    else { salvar(); enviar(); }
  }));
  // se a pessoa já escolheu a última e o envio falhou, mostra o botão de reenviar
  if (st.i === TOTAL - 1 && st.resp[c]) enviar();
  document.getElementById("reenviar").onclick = enviar;
}

async function enviar() {
  const msg = document.getElementById("msg"), nav = document.getElementById("navEnvio"), b = document.getElementById("reenviar");
  msg.hidden = false; msg.className = "dica"; msg.textContent = "Enviando suas respostas...";
  nav.hidden = true;
  try {
    await rpc("quiz_enviar", { p_nome: st.nome, p_respostas: st.resp, p_dispositivo: DISP });
    st.enviado = true; salvar(); render();
  } catch (err) {
    msg.className = "erro";
    if (/JA_ENVIOU_CELULAR/.test(err.message)) { msg.textContent = "Este celular já enviou respostas. Só vale uma participação por celular."; return; }
    if (/JA_ENVIOU_NOME/.test(err.message)) { msg.textContent = `Já existe uma resposta com o nome "${st.nome}". Se não foi você, fale com quem está organizando.`; return; }
    msg.textContent = "Não foi possível enviar. Confira a internet e toque em Tentar enviar de novo.";
    nav.hidden = false;
  }
}

function telaFim() {
  app.innerHTML = `
    <div class="fim wrap" style="padding-top:4vh">
      <span class="etiqueta">Respostas enviadas</span>
      <h1>Valeu, <em>${esc(st.nome)}</em>!</h1>
      <p class="sub">Você respondeu ${respondidas()} de ${TOTAL} fotos. O ranking e o vencedor da cesta de doces serão revelados no final da dinâmica.</p>
    </div>
    <h2>Seus palpites</h2>
    <div class="revisao">${F.map((c, i) => `<div class="mini"><img src="${foto(c)}" alt="Foto ${i + 1}"><span class="${st.resp[c] ? "" : "falta"}">${st.resp[c] ? esc(st.resp[c]) : "sem resposta"}</span></div>`).join("")}</div>`;
  window.scrollTo(0, 0);
}

render();

// se o ranking foi zerado, libera este celular para jogar de novo
if (st.enviado) {
  rpc("quiz_pode_participar", { p_nome: st.nome, p_dispositivo: DISP }).then(r => {
    if (r === "OK") {
      st = { nome: "", i: 0, resp: {}, etapa: "inicio", enviado: false };
      salvar(); render();
    }
  }).catch(() => {});
}
</script>
</body>
</html>
